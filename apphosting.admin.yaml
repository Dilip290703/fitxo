# Admin panel → admin.fitxo.co.in   (backend: fitxo-admin, environment: admin)
#
# The ONLY backend that gets the service-role key. It is RUNTIME-only and must
# never be marked BUILD — CLAUDE.md rule, and Next would be free to inline a
# BUILD-available variable into a client bundle.

scripts:
  buildCommand: pnpm --filter @fitxo/admin build
  # NOT the package's own `start` script — it hardcodes a dev port so all four
  # panels can run locally at once, and a container listening on that port
  # fails App Hosting's health check. Bare `next start` reads PORT (8080).
  runCommand: pnpm --filter @fitxo/admin exec next start

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: supabase-url
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: supabase-anon-key
    availability: [BUILD, RUNTIME]

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: supabase-service-role-key
    availability: [RUNTIME]

  # MFA enforcement is entirely app-side, so setting this on the deploy is what
  # actually switches it on for the deployed panel.
  - variable: NEXT_PUBLIC_ADMIN_REQUIRE_MFA
    value: "true"
    availability: [BUILD, RUNTIME]

  # ⚠️ Every admin's email must be on this list or they are signed out at login.
  # Currently: fitxo.contact@gmail.com, jaybidwe2034@gmail.com.
  # Dilip's and Amit's still need adding:
  #   firebase apphosting:secrets:set admin-email-allowlist --project fitxo-app
  - variable: ADMIN_EMAIL_ALLOWLIST
    secret: admin-email-allowlist
    availability: [RUNTIME]
