# Firebase App Hosting — customer panel (fitxo.co.in)
#
# Every value is pulled from Cloud Secret Manager rather than written here, so
# the same file works for dev and prod: you change the secret's value, not the
# repo. NEXT_PUBLIC_* vars are marked BUILD as well as RUNTIME because Next.js
# inlines them into the client bundle at build time.
#
# Create the secrets once with:
#   firebase apphosting:secrets:set supabase-url
#   firebase apphosting:secrets:set supabase-anon-key
#   firebase apphosting:secrets:set razorpay-key-id
#   firebase apphosting:secrets:set razorpay-key-secret
#   firebase apphosting:secrets:set razorpay-webhook-secret

runConfig:
  # Fashion traffic is bursty; 0 min instances keeps the idle cost at nothing.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: supabase-url
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: supabase-anon-key
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    secret: razorpay-key-id
    availability: [BUILD, RUNTIME]

  # Server-only. Never marked BUILD — it must not reach the client bundle.
  - variable: RAZORPAY_KEY_SECRET
    secret: razorpay-key-secret
    availability: [RUNTIME]

  # Needed for the payment.captured webhook, which has never been provable on
  # localhost. This is the deploy that finally lets it be tested.
  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: razorpay-webhook-secret
    availability: [RUNTIME]
