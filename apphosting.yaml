# Firebase App Hosting — base config, repo root.
#
# WHY THIS LIVES AT THE ROOT AND NOT IN apps/<panel>/
# App Hosting does not support pnpm workspaces (firebase-tools#7478, open since
# 2024-07; Firebase confirmed 2025-07 it is still only backlogged). Pointing a
# backend at apps/customer fails with:
#
#   Missing dependency lock file at path '/workspace/apps/customer'
#
# because pnpm keeps a single pnpm-lock.yaml at the repo root, and our apps
# depend on @fitxo/supabase, @fitxo/ui and @fitxo/pincode as workspace:* — which
# only resolve when install runs from the root.
#
# So every backend sets its Root directory to "/" and picks its app with an
# explicit build/run command instead.
#
# HOW A BACKEND CHOOSES ITS APP
# Each backend sets an Environment name in the console
# (Settings → Environment). That name selects the matching file next to this
# one: environment "customer" → apphosting.customer.yaml. Those files are
# self-contained — they repeat runConfig and env rather than relying on merge
# order, so what a backend gets is readable in one file.
#
#   backend          environment   file
#   fitxo-customer   customer      apphosting.customer.yaml
#   fitxo-admin      admin         apphosting.admin.yaml
#   fitxo-agent      agent         apphosting.agent.yaml
#   fitxo-store      store         apphosting.store.yaml
#
# A backend with NO environment name set falls back to this file, which has no
# build command and will fail — deliberately. A backend that cannot say which of
# the four panels it is should not deploy one at random.

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
